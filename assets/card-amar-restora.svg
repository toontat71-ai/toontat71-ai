<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img" aria-label="Amar Restora: POS, QR ordering, kitchen screen, pagers and automatic bKash/Nagad checks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1124"/><stop offset="1" stop-color="#111a33"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.7"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ef4444" stop-opacity="0.5"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="clip"><rect width="500" height="250" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="500" height="250" fill="url(#bg)"/>
    <circle cx="460" cy="260" r="110" fill="url(#accent)" opacity="0.28" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 -30;0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="1" y="1" width="498" height="248" rx="19" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <rect x="28" y="26" width="64" height="64" rx="16" fill="url(#accent)"/>
  <g transform="translate(60 58)"><path d="M-24 10 h48 M-20 10 a20 20 0 0 1 40 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="-13" r="3.5" fill="#fff"/><path d="M-26 17 h52" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>

  <text x="108" y="54" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Amar Restora</text>
  <text x="108" y="80" font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="14" fill="#94a3b8">restaurant system</text>

  <rect x="326" y="25" width="150" height="26" rx="13" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.5"/>
  
  <circle cx="341" cy="38" r="4" fill="#fbbf24"/>
  <text x="352" y="43" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#fbbf24">In development</text>

  <g font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#cbd5e1"><text x="28" y="142">POS, QR ordering, kitchen screen, pagers</text><text x="28" y="167">and automatic bKash/Nagad checks.</text></g>
  <g font-family="Consolas, 'SF Mono', Menlo, 'Courier New', monospace" font-size="13" fill="#e2e8f0"><rect x="28" y="198" width="77" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="66" y="216" text-anchor="middle">Next.js</text><rect x="112.80000000000001" y="198" width="60" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="143" y="216" text-anchor="middle">React</text><rect x="180.8" y="198" width="77" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="219" y="216" text-anchor="middle">Drizzle</text><rect x="265.6" y="198" width="102" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/><text x="317" y="216" text-anchor="middle">PostgreSQL</text></g>
</svg>
